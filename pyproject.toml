[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aipcc-product-onboarding"
version = "1.0.0"
description = "Product onboarding tools for Konflux platform"
authors = [
    {name = "AIPCC Team"},
]
dependencies = [
    "ruamel.yaml>=0.17.0",
    "jinja2>=3.0.0",
]
requires-python = ">=3.8"

[tool.hatch.build.targets.wheel]
only-include = [
    "onboard-product.py",
    "templates",
    "configs",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"