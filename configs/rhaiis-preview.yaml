definitions:
  - application: rhaiis
    tenant: ai-tenant
    branch: preview
    components:
      - name: rhaiis-cuda-ubi9
        context: .
        dockerfile: Containerfile.cuda-ubi9
        url: https://gitlab.com/redhat/rhel-ai/rhaiis/containers
        stage_repository: quay.io/aipcc/rhaiis/cuda-ubi9
        prod_repository: registry.redhat.io/rhaiis-preview/vllm-cuda-rhel9
        pipelinerun:
          - build_args_file: build-args/cuda-ubi9.conf
            pipeline: full-container
            variant: cuda-ubi9
            build_platforms:
              - linux/x86_64
              - linux-d160-m2xlarge/arm64
            additional_build_secret: rhel-ai-private-index-auth
            skip-checks: true
            timeouts:
              pipeline: "4h0m0s"
    release_plan:
      - name: rhaiis-ubi9-stage
        grace_period: 30
        autorelease: true
      - name: rhaiis-ubi9-prod
        grace_period: 365
        autorelease: false
    release_plan_admission:
      - name: rhaiis-ubi9-stage
        policy: registry-ai-quay-stage
        single_component_mode: true
        tags:
          - "qwen3-preview"
          - "qwen3-preview-{{ timestamp }}"
        product_name: Red Hat AI Inference Server
        product_version: "3.2"
        product_id: [ 1001 ]
        intention: staging
        service_account: release-registry-rhelai
        pipeline_path: pipelines/managed/push-to-external-registry/push-to-external-registry.yaml
      - name: rhaiis-ubi9-prod
        policy: registry-ai-containers-prod
        single_component_mode: true
        tags:
          - "qwen3-preview"
          - "qwen3-preview-{{ timestamp }}"
        product_name: Red Hat AI Inference Server
        product_version: "3.2"
        product_id: [ 1001 ]
        intention: production
        service_account: release-registry-prod
        pipeline_path: pipelines/managed/rh-advisories/rh-advisories.yaml
