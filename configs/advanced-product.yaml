#           contentType: "disk-image"  # OPTIONAL - defaults to "disk-image"
    
    # ===========================================================================
    # RELEASE PLAN CONFIGURATION
    # ===========================================================================
    release_plan:
      - # REQUIRED: Release plan base name (no branch suffix - added automatically)
        # Used in: KRD releaseplan.yaml.j2 for ReleasePlan resource name
        # Final name: {name}-{branch} (e.g., "my-product-stage-rhoai-2-23")
        # Must have corresponding release_plan_admission entry
        name: my-product-stage
        
        # REQUIRED: Grace period before release execution (days)
        # Used in: KRD releaseplan.yaml.j2 for release timing control
        # Allows time for manual intervention before automatic release
        grace_period: 30
        
        # OPTIONAL: Enable automatic release triggers
        # Used in: KRD releaseplan.yaml.j2 for release automation
        # When true: releases trigger automatically on successful builds
        # When false: requires manual release approval
        # Default: false
        autorelease: true
    
    # ===========================================================================
    # RELEASE PLAN ADMISSION CONFIGURATION  
    # ===========================================================================
    release_plan_admission:
      - # REQUIRED: Must match corresponding release_plan name
        # Used in: KRD releaseplanadmission.yaml.j2 for admission control
        # Links admission policy to specific release plan
        name: my-product-stage
        
        # REQUIRED: Release policy name
        # Used in: KRD releaseplanadmission.yaml.j2 for approval workflows
        # References a ReleasePlanAdmissionPolicy resource
        # Common values: "registry-quay-stage", "registry-quay-prod"
        policy: registry-quay-stage
        
        # OPTIONAL: Single component release mode
        # Used in: KRD releaseplanadmission.yaml.j2 for release bundling
        # When true: each component releases independently
        # When false: all components release together as a bundle
        # Default: false
        single_component_mode: true
        
        # REQUIRED: Service account for pipeline execution
        # Used in: KRD releaseplanadmission.yaml.j2 for pipeline authentication
        # Pattern: "release-registry-{product-name}" or specific service account name
        # Must have appropriate registry push permissions
        service_account: release-registry-my-product
        
        # REQUIRED: Pipeline path in release-service-catalog repository
        # Used in: KRD releaseplanadmission.yaml.j2 for pipeline reference
        # Common paths: "pipelines/managed/push-to-external-registry/push-to-external-registry.yaml" (stage)
        #               "pipelines/managed/rh-advisories/rh-advisories.yaml" (prod)
        pipeline_path: pipelines/managed/push-to-external-registry/push-to-external-registry.yaml
        
        # REQUIRED: Image tagging strategy
        # Used in: KRD releaseplanadmission.yaml.j2 for image version management
        # Supports Go template syntax with variables: timestamp, revision, etc.
        tags:
          - "rhoai-2.23"                    # Static branch tag
          - "rhoai-2.23-{{ timestamp }}"    # Timestamped tag for tracking
          - "latest-rhoai-2.23"             # Latest tag for branch
        
        # REQUIRED: Product display name for metadata
        # Used in: KRD releaseplanadmission.yaml.j2 for product identification
        # Used in: Release notifications and dashboards
        product_name: "My Product Suite"
        
        # REQUIRED: Product version for this release
        # Used in: KRD releaseplanadmission.yaml.j2 for version tracking
        # Used in: Release metadata and compliance reporting
        product_version: "2.23"
        
        # REQUIRED: Product ID numbers for compliance
        # Used in: KRD releaseplanadmission.yaml.j2 for product tracking
        # Array format allows multiple product IDs if needed
        product_id: [ 12345 ]
        
        # REQUIRED: Release intention/environment
        # Used in: KRD releaseplanadmission.yaml.j2 for environment targeting
        # Common values: "staging", "production", "testing", "development"
        intention: staging

