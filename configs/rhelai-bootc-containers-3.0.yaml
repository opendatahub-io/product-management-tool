definitions:
  - application: rhelai-bootc
    tenant: rhel-ai-tenant
    branch: "3.0"
    components:
      # Base bootc-cuda container (with build nudges)
      - name: bootc-cuda
        context: .
        dockerfile: Containerfile.cuda
        url: https://gitlab.com/redhat/rhel-ai/containers/bootc
        stage_repository: quay.io/aipcc/rhelai3/bootc-cuda-rhel9
        prod_repository: registry.redhat.io/rhelai3/bootc-nvidia-rhel9
        component:
          build_nudge_enabled: true
          build_nudges_ref:
            - bootc-cuda-qcow2-disk-image
            - bootc-cuda-qcow2-disk-image-aarch64
            - bootc-cuda-iso-disk-image
            - bootc-cuda-iso-disk-image-aarch64
            - bootc-cuda-aws
            - bootc-cuda-azure
            - bootc-cuda-gcp
        pipelinerun:
          - pipeline: full-container
            path_context: "."
            build_args_file: argfile-cuda.conf
            additional_build_secret: global-pull-secret
            build_platforms:
              - linux-d160-m4xlarge/amd64
              - linux-d160-m4xlarge/arm64
            snyk_project_name: ai-red-hat-enterprise-linux-ai
            snyk_org: 01db29d0-f8e7-4709-9725-442d48ddfba6
            timeouts:
              pipeline: "24h0m0s"
              tasks: "6h0m0s"
              finally: "6h0m0s"

      # Cloud provider variants
      - name: bootc-cuda-aws
        context: ai-lab-recipes/training/cloud
        dockerfile: Containerfile
        url: https://gitlab.com/redhat/rhel-ai/containers/bootc
        stage_repository: quay.io/aipcc/rhelai3/bootc-cuda-aws-rhel9
        prod_repository: registry.redhat.io/rhelai3/bootc-aws-nvidia-rhel9
        component:
          build_nudge_enabled: true
          build_nudges_ref:
            - bootc-cuda-aws-disk-image
        pipelinerun:
          - pipeline: full-container
            path_context: "ai-lab-recipes/training/cloud"
            build_args_file: argfile-cuda-cloud.conf
            additional_build_secret: global-pull-secret
            snyk_project_name: ai-red-hat-enterprise-linux-ai
            snyk_org: 01db29d0-f8e7-4709-9725-442d48ddfba6
            timeouts:
              pipeline: "6h0m0s"
              tasks: "4h0m0s"
              finally: "1h0m0s"

      - name: bootc-cuda-azure
        context: ai-lab-recipes/training/cloud
        dockerfile: Containerfile
        url: https://gitlab.com/redhat/rhel-ai/containers/bootc
        stage_repository: quay.io/aipcc/rhelai3/bootc-cuda-azure-rhel9
        prod_repository: registry.redhat.io/rhelai3/bootc-azure-nvidia-rhel9
        component:
          build_nudge_enabled: true
          build_nudges_ref:
            - bootc-cuda-azure-disk-image
        pipelinerun:
          - pipeline: full-container
            path_context: "ai-lab-recipes/training/cloud"
            build_args_file: argfile-cuda-cloud.conf
            additional_build_secret: global-pull-secret
            snyk_project_name: ai-red-hat-enterprise-linux-ai
            snyk_org: 01db29d0-f8e7-4709-9725-442d48ddfba6
            timeouts:
              pipeline: "6h0m0s"
              tasks: "4h0m0s"
              finally: "1h0m0s"

      - name: bootc-cuda-gcp
        context: ai-lab-recipes/training/cloud
        dockerfile: Containerfile
        url: https://gitlab.com/redhat/rhel-ai/containers/bootc
        stage_repository: quay.io/aipcc/rhelai3/bootc-cuda-gcp-rhel9
        prod_repository: registry.redhat.io/rhelai3/bootc-gcp-nvidia-rhel9
        component:
          build_nudge_enabled: true
          build_nudges_ref:
            - bootc-cuda-gcp-disk-image
        pipelinerun:
          - pipeline: full-container
            path_context: "ai-lab-recipes/training/cloud"
            build_args_file: argfile-cuda-cloud.conf
            additional_build_secret: global-pull-secret
            snyk_project_name: ai-red-hat-enterprise-linux-ai
            snyk_org: 01db29d0-f8e7-4709-9725-442d48ddfba6
            timeouts:
              pipeline: "6h0m0s"
              tasks: "4h0m0s"
              finally: "1h0m0s"

    release_plan:
      - name: bootc-containers-stage
        grace_period: 30
        autorelease: true
      - name: bootc-containers-prod
        grace_period: 30
        autorelease: false

    release_plan_admission:
      - name: bootc-containers-stage
        policy: registry-rhel-ai-quay-stage
        single_component_mode: true
        service_account: release-registry-rhelai
        pipeline_path: pipelines/managed/push-to-external-registry/push-to-external-registry.yaml
        integration_test_scenario:
          enabled: true
          optional: true
          timeout: 40m0s
          single_component: true
        tags:
          - "3.0.0"
          - "3.0"
          - "3.0.0-{{ timestamp }}"
          - "latest"
        product_name: Red Hat Enterprise Linux AI
        product_version: "3.0"
        product_id: [ 932 ]
        intention: staging
      - name: bootc-containers-prod
        policy: registry-rhel-ai-containers-prod
        single_component_mode: true
        service_account: release-registry-prod
        pipeline_path: pipelines/managed/rh-advisories/rh-advisories.yaml
        tags:
          - "3.0.0"
          - "3.0"
          - "3.0.0-{{ timestamp }}"
          - "latest"
        product_name: Red Hat Enterprise Linux AI
        product_version: "3.0"
        product_id: [ 932 ]
        intention: production
