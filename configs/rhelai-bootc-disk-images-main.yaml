      - name: bootc-cuda-gcp-disk-image
        context: .
        dockerfile: bib-cuda-gcp.yaml
        url: https://gitlab.com/redhat/rhel-ai/containers/bootc
        pipelinerun:
          - pipeline: disk-image
            path_context: "."
            snyk_project_name: ai-red-hat-enterprise-linux-ai
