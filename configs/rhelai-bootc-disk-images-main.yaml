definitions:
  - application: rhelai-bootc
    tenant: rhel-ai-tenant
    branch: "3.0"
    components:
      # ISO disk images
      - name: bootc-cuda-iso-disk-image
        context: .
        dockerfile: bib-cuda.yaml
        url: https://gitlab.com/redhat/rhel-ai/containers/bootc
        pipelinerun:
          - pipeline: disk-image
            path_context: "."
            build_platforms:
              - linux-root/amd64
            snyk_project_name: ai-red-hat-enterprise-linux-ai
            snyk_org: 01db29d0-f8e7-4709-9725-442d48ddfba6
            timeouts:
              pipeline: "6h0m0s"
              tasks: "4h0m0s"
              finally: "1h0m0s"
        rpa_values:
          destination: rhelai-3_DOT_0-for-rhel-9-x86_64-isos
          version: "3.0"
          filename: rhel-ai-cuda-3.0-{{ release_timestamp }}-x86_64-boot.iso.gz
          source: install.iso.gz
          productName: "Binary_RL_Red Hat Enterprise Linux AI"
          productCode: "RHELAI"
          productVersion: "3.0.0"
          filePrefix: "rhel-ai-cuda-3.0"
          contentType: disk-image

      - name: bootc-cuda-iso-disk-image-aarch64
        context: .
        dockerfile: bib-cuda.yaml
        url: https://gitlab.com/redhat/rhel-ai/containers/bootc
