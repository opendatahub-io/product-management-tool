          source: install.iso.gz
          productName: "Binary_RL_Red Hat Enterprise Linux AI"
          productCode: "RHELAI"
          productVersion: "3.0.0"
          filePrefix: "rhel-ai-cuda-3.0"
          contentType: disk-image

