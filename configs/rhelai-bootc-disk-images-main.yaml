          productVersion: "3.0.0"
          filePrefix: "rhel-ai-cuda-gcp-3.0"
          contentType: disk-image

    release_plan:
      - name: bootc-disk-images-stage
        grace_period: 30
        autorelease: true
      - name: bootc-disk-images-prod
        grace_period: 30
        autorelease: false

    release_plan_admission:
      - name: bootc-disk-images-stage
        policy: registry-rhel-ai-disk-images-stage
        integration_test_scenario:
          enabled: true
          optional: true
          timeout: 40m0s
          single_component: true
        single_component_mode: true
        service_account: release-registry-staging
        pipeline_path: pipelines/managed/push-disk-images-to-cdn/push-disk-images-to-cdn.yaml
        product_name: Red Hat Enterprise Linux AI
        product_version: "3.0"
        product_id: [ 932 ]
        intention: staging
      - name: bootc-disk-images-prod
        policy: registry-rhel-ai-disk-images-prod
        single_component_mode: true
        service_account: release-registry-prod
        pipeline_path: pipelines/managed/push-disk-images-to-cdn/push-disk-images-to-cdn.yaml
        product_name: Red Hat Enterprise Linux AI
        product_version: "3.0"
        product_id: [ 932 ]
        intention: production
