definitions:
  - application: base-images
    tenant: ai-tenant
    branch: main
    components:
      - name: base-image-cpu
        context: .
        dockerfile: Containerfile.cpu-app
        url: https://gitlab.com/redhat/rhel-ai/core/base-images/app
        stage_repository: quay.io/aipcc/base-images/cpu
        pipelinerun:
          - build_args_file: build-args/cpu-app.conf
            pipeline: full-container
            variant: cpu
            build_platforms:
              - linux/arm64
              - linux/ppc64le
              - linux/x86_64
            additional_build_secret: global-pull-secret
            skip-checks: false
            timeouts:
              pipeline: "4h0m0s"
      - name: base-image-cuda
        context: .
        dockerfile: Containerfile.cuda-app
