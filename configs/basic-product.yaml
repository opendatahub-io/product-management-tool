# Product Onboarding Configuration
# Usage: python3 hack/new_product.py --config data/product-onboarding/your-product.yaml

definitions:
  - application: my-product              # REQUIRED - App name, used in Application resource and directory structure
    tenant: ai-tenant                   # REQUIRED - Konflux tenant, used in KRD output path organization  
    branch: rhoai-2.23                  # REQUIRED - Target branch, used in all resources for branch-aware naming
    
    components:
      - name: my-service                 # REQUIRED - Component name, used in Component resource and pipelinerun files
        context: .                       # REQUIRED - Build context directory, used in pipelinerun
        dockerfile: Containerfile        # REQUIRED - Dockerfile path, used in pipelinerun and CEL expressions
        url: https://gitlab.com/redhat/my-org/my-service  # REQUIRED - Source repo URL, used in Component
        stage_repository: quay.io/my-org/my-service  # REQUIRED - Stage registry destination, used in ReleasePlanAdmission  
        prod_repository: quay.io/my-org-prod/my-service  # REQUIRED - Prod registry destination, used in ReleasePlanAdmission
        local_repo_path: /path/to/local/repo  # OPTIONAL - Override repo path for .tekton files
        
        pipelinerun:
          - build_args_file: build-args/default.conf  # REQUIRED - Build config file, used in pipelinerun
            pipeline: full-container     # REQUIRED - Pipeline type, used in pipelinerun spec
            variant: gpu                 # OPTIONAL - Build variant, enables variant-specific path monitoring
            path_context: ./context/     # OPTIONAL - Build context path, used in pipelinerun (default: "./context/")
            snyk_project_name: my-product-name  # OPTIONAL - Snyk project name for security scanning (default: "ai-red-hat-inference-server")
            snyk_org: 98e4f46e-334c-414b-b444-43361f404b2f  # OPTIONAL - Snyk organization ID (default: "98e4f46e-334c-414b-b444-43361f404b2f")
            build_platforms:             # OPTIONAL - Target architectures, used in pipelinerun
              - linux/x86_64
              - linux/arm64
            additional_build_secret: my-registry-auth  # REQUIRED - Registry auth secret, used in pipelinerun
            skip-checks: false           # OPTIONAL - Bypass quality gates, used in pipelinerun (default: false)
            timeouts:                    # OPTIONAL - Execution time limits, used in pipelinerun
              pipeline: "2h0m0s"
    
    release_plan:
      - name: my-product-stage           # REQUIRED - Release plan name, used in ReleasePlan resource
        grace_period: 30                 # REQUIRED - Release delay in days, used in ReleasePlan
        autorelease: true                # OPTIONAL - Enable automatic releases, used in ReleasePlan (default: false)
    
    release_plan_admission:
      - name: my-product-stage           # REQUIRED - Must match release_plan name, used in RPA
        policy: registry-quay-stage      # REQUIRED - Release policy, used in RPA
        single_component_mode: true      # OPTIONAL - Individual vs bundled releases, used in RPA (default: false)
        service_account: release-registry-my-product  # REQUIRED - Service account for pipeline execution, used in RPA
        pipeline_path: pipelines/managed/push-to-external-registry/push-to-external-registry.yaml  # REQUIRED - Pipeline path in release-service-catalog
        tags:                            # REQUIRED - Image tagging strategy, used in RPA
          - "rhoai-2.23"
          - "rhoai-2.23-{{ timestamp }}"
        product_name: "My Product Suite" # REQUIRED - Product display name, used in RPA metadata
        product_version: "2.23"          # REQUIRED - Product version, used in RPA metadata
        product_id: [ 12345 ]            # REQUIRED - Product ID for compliance, used in RPA
        intention: staging               # REQUIRED - Target environment, used in RPA
