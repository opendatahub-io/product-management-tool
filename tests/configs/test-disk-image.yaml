# Comprehensive test config for disk-image pipeline
# Contains ALL available options for regression testing
definitions:
  - application: test-disk-image
    tenant: test-disk-tenant
    branch: test-disk-branch

    components:
      items:
        - name: test-disk-component
          context: ./test-disk-context
          dockerfile: TestDiskContainerfile
          url: https://gitlab.com/test-org/test-disk-repo/test-disk-component
          stage_repository: quay.io/test-org/test-disk-stage
          prod_repository: quay.io/test-org-prod/test-disk-prod

          pipelinerun:
            - pipeline: disk-image
              image_type: iso
              config_toml: config/config-test-iso.toml
              path_context: ./test-disk-build/
              build_platforms:
                - linux-root/amd64
                - linux-root/arm64
              params:
                - name: snyk-project-name
                  value: test-disk-snyk-project
                - name: snyk-org
                  value: test-disk-snyk-org-uuid
              timeouts:
                finally: "2h0m0s"
                pipeline: "8h0m0s"
                tasks: "6h0m0s"

          rpa_values:
            staged:
              destination: test-destination-path
              version: "1.0.0-test"
              files:
                - filename: "test-disk-{{ release_timestamp }}-x86_64-boot.iso.gz"
                  source: "test-install.iso.gz"
            contentGateway:
              productName: "Test Disk Image Product"
              productCode: "TESTDISK"
              productVersionName: "1.0.0-test-staging"
              filePrefix: "test-disk-1.0.0"
              contentType: "disk-image"

    integration_test_scenarios:
      - template: its-ecp
        name: check-stage-ecp
        components:
          - test-disk-component
        optional: true
        params:
          - name: POLICY_CONFIGURATION
            value: rhtap-releng-tenant/registry-rhel-ai-disk-images-stage
          - name: TIMEOUT
            value: 40m0s
          - name: SINGLE_COMPONENT
            value: "true"
          - name: FOO
            value: true
          - name: BAR
            value: 123

    release_plan:
      - name: test-disk-release-plan
        grace_period: 14
        autorelease: true

    release_plan_admission:
      common:
        single_component_mode: true
        cdn_env: stage
        push_source_container_default: false
        tags:
          - "test-disk-latest"
          - "test-disk-{{ timestamp }}"
        product_name: "Test Disk Image Suite"
        product_version: "1.0.0-disk-test"
        product_id: [77777]
      rpas:
        - name: test-disk-release-plan
          policy: test-disk-policy
          service_account: test-disk-service-account
          pipeline_path: test/disk-pipelines/test-disk-pipeline.yaml
          intention: disk-testing
