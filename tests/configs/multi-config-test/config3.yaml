# Multi-config test 3 - different tenant
definitions:
  - application: multi-test-app3
    tenant: another-tenant
    branch: v1.0

    components:
      items:
        - name: component-c
          context: .
          dockerfile: Containerfile
          url: https://gitlab.com/test/repo-c
          stage_repository: quay.io/test/app3-stage
          prod_repository: quay.io/test/app3-prod

          pipelinerun:
            - build_args_file: build.conf
              pipeline: full-container
              additional_build_secret: test-secret

    release_plan:
      - name: app3-stage
        grace_period: 7
        autorelease: true

    release_plan_admission:
      common:
        single_component_mode: false
        product_name: "Test App 3"
        product_version: "1.0"
        product_id: [10003]
      rpas:
        - name: app3-stage
          policy: test-policy
          service_account: test-sa
          pipeline_path: test/pipeline.yaml
          tags: ["stage"]
          intention: staging
