# Multi-config test 1 - minimal config
definitions:
  - application: multi-test-app1
    tenant: multi-test-tenant
    branch: main

    components:
      - name: component-a
        context: .
        dockerfile: Containerfile
        url: https://gitlab.com/test/repo-a
        stage_repository: quay.io/test/app1-stage
        prod_repository: quay.io/test/app1-prod

        pipelinerun:
          - build_args_file: build.conf
            pipeline: full-container
            additional_build_secret: test-secret

    release_plan:
      - name: app1-stage
        grace_period: 7
        autorelease: true

    release_plan_admission:
      - name: app1-stage
        policy: test-policy
        single_component_mode: false
        service_account: test-sa
        pipeline_path: test/pipeline.yaml
        tags: ["stage"]
        product_name: "Test App 1"
        product_version: "1.0"
        product_id: [10001]
        intention: staging
