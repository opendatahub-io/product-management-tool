# Multi-config test 2 - different app in same tenant
definitions:
  - application: multi-test-app2
    tenant: multi-test-tenant
    branch: main

    components:
      items:
        - name: component-b
          context: .
          dockerfile: Containerfile
          url: https://gitlab.com/test/repo-b
          stage_repository: quay.io/test/app2-stage
          prod_repository: quay.io/test/app2-prod

          pipelinerun:
            - build_args_file: build.conf
              pipeline: full-container
              params:
                - name: additional-build-secret
                  value: test-secret

    release_plan:
      - name: app2-stage
        grace_period: 7
        autorelease: true

    release_plan_admission:
      common:
        single_component_mode: false
        product_name: "Test App 2"
        product_version: "1.0"
        product_id: [10002]
      rpas:
        - name: app2-stage
          policy: test-policy
          service_account: test-sa
          pipeline_path: test/pipeline.yaml
          tags: ["stage"]
          intention: staging
