# Comprehensive test config for full-container pipeline
# Contains ALL available options for regression testing
definitions:
  - application: test-full-container
    tenant: test-tenant
    branch: test-branch-1.0

    components:
      common:
        pipelinerun:
          pipeline: full-container
      items:
        - name: test-component-1
          context: ./test-context
          dockerfile: TestContainerfile-1
          url: https://gitlab.com/test-org/test-repo/test-component
          stage_repository: quay.io/test-org/test-component-1-stage
          stage_rc_repository: quay.io/test-org/test-component-1-rc
          prod_repository: quay.io/test-org-prod/test-component-1-prod

          component:
            mintmaker_enabled: true

          pipelinerun:
            - build_args_file: test-args/build.conf
              variant: test-variant
              path_context: ./test-build-context/
              snyk_project_name: test-snyk-project
              snyk_org: test-snyk-org-uuid
              build_platforms:
                - linux/x86_64
                - linux/arm64
                - linux/s390x
              additional_build_secret: test-registry-secret
              skip-checks: true
              squash-build: true
              use_build_args: true
              cel_path_changed:
                - "ci"
                - "context/app/***"
                - "context/common/***"
                - "context/{variant}/app/***"
                - "context/{variant}/common/***"
                - "context/{variant}/repo/*"
              cel_push_tag_prefixes:
                - "v"
                - "{variant}-v"
              timeouts:
                pipeline: "3h0m0s"
                tasks: "2h30m0s"
                finally: "30m0s"
        - name: test-component-2
          context: ./test-context-2
          dockerfile: TestContainerfile-2
          url: https://gitlab.com/test-org/test-repo-2/test-component-2
          stage_repository: quay.io/test-org/test-component-2-stage
          prod_repository: quay.io/test-org-prod/test-component-2-prod

          pipelinerun:
            - build_args_file: test-args/build-2.conf
              variant: test-variant-2
              path_context: ./test-build-context-2/
              snyk_project_name: test-snyk-project-2
              snyk_org: test-snyk-org-uuid-2
              build_platforms:
                - linux/x86_64
                - linux/arm64
              additional_build_secret: test-registry-secret-2
              skip-checks: false
              timeouts:
                pipeline: "2h0m0s"
                tasks: "1h30m0s"
                finally: "15m0s"

    integration_test_scenarios:
      - template: its-ecp
        name: check-stage-ecp
        optional: true
        # field "components" is omitted so it should include all components
        params:
          - name: POLICY_CONFIGURATION
            value: rhtap-releng-tenant/registry-rhel-ai-quay-stage
          - name: TIMEOUT
            value: 40m0s
          - name: SINGLE_COMPONENT
            value: "true"
      - template: its-ecp
        name: check-prod-ecp
        optional: false
        components:
          - test-component-1
          - test-component-2
        params:
          - name: POLICY_CONFIGURATION
            value: rhtap-releng-tenant/registry-rhel-ai-quay-prod
          - name: TIMEOUT
            value: 40m0s
          - name: SINGLE_COMPONENT
            value: "true"

    release_plan:
      - name: test-release-plan-stage
        grace_period: 7
        autorelease: true
      - name: test-release-plan-prod
        grace_period: 30
        autorelease: false
      - name: test-release-plan-stage-rc
        grace_period: 14
        autorelease: false

    release_plan_admission:
      common:
        annotations:
          stream_name: test-stream
          cpe_name: test_product
          rhel_target: el9
        single_component_mode: false
        tags:
          - "latest"
          - "{{ timestamp }}"
          - "v1.0.0-{{ revision }}"
        product_name: "Test Product Suite"
        product_version: "1.0.0"
        product_id: [99999]
      rpas:
        - name: test-release-plan-stage
          policy: stage-policy-name
          service_account: stage-service-account
          pipeline_path: test/pipelines/test-stage-pipeline.yaml
          intention: staging
          tags:
            - "stage-latest"
        - name: test-release-plan-prod
          policy: prod-policy-name
          single_component_mode: true
          service_account: prod-service-account
          pipeline_path: pipelines/managed/rh-advisories/rh-advisories.yaml
          intention: production
          tags:
            - "stable"
          timeouts:
            pipeline: "8h0m0s"
            tasks: "8h0m0s"
        - name: test-release-plan-stage-rc
          policy: rc-policy-name
          service_account: rc-service-account
          pipeline_path: test/pipelines/test-rc-pipeline.yaml
          intention: staging
          tags:
            - "rc"
