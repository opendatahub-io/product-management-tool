apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://gitlab.com/test-org/test-repo/test-component/-/tree/{{revision}}
    build.appstudio.redhat.com/commit_sha: "{{revision}}"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    build.appstudio.redhat.com/target_branch: "{{target_branch}}"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "test-branch-1.0" && (
          ".tekton/test-component-1-on-pull-request.yaml".pathChanged() ||
          "test-args/build.conf".pathChanged() ||
          "ci".pathChanged() ||
          "TestContainerfile-1".pathChanged() ||
          "context/app/***".pathChanged() ||
          "context/common/***".pathChanged() ||
          "context/test-variant/app/***".pathChanged() ||
          "context/test-variant/common/***".pathChanged() ||
          "context/test-variant/repo/*".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: test-full-container-test-branch-1-0
    appstudio.openshift.io/component: test-component-1-test-branch-1-0
    pipelines.appstudio.openshift.io/type: build
  name: test-component-1-test-branch-1-0-on-pull-request
  namespace: test-tenant
spec:
  timeouts:
    pipeline: "3h0m0s"
    tasks: "2h30m0s"
    finally: "30m0s"
  params:
  - name: git-url
    value: "{{source_url}}"
  - name: revision
    value: "{{revision}}"
  - name: output-image
    value: quay.io/redhat-user-workloads/test-tenant/test-full-container-test-branch-1-0/test-component-1-test-branch-1-0:on-pr-{{revision}}
  - name: image-expires-after
    value: 1d
  - name: dockerfile
    value: TestContainerfile-1
  - name: path-context
    value: ./test-build-context/
  - name: build-args-file
    value: test-args/build.conf
  - name: build-args
    value:
    - NAME=test-org-prod/test-component-1-prod
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
    - linux/s390x
  - name: squash-build
    value: "true"
  - name: additional-build-secret
    value: test-registry-secret
  - name: skip-checks
    value: "true"
  - name: snyk-project-name
    value: test-snyk-project
  - name: snyk-org
    value: test-snyk-org-uuid
  - name: add-capabilities
    value: ""
  - name: labels
    value:
    - cpe=cpe:/a:redhat:test_product:1.0::el9
  pipelineRef:
    params:
    - name: org
      value: redhat
    - name: repo
      value: rhel-ai/konflux-data
    - name: scmType
      value: gitlab
    - name: serverURL
      value: https://gitlab.com
    - name: revision
      value: main
    - name: pathInRepo
      value: pipelines/full-container.yaml
    - name: token
      value: pipelines-as-code-secret
    - name: tokenKey
      value: password
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-test-component-1-test-branch-1-0
  workspaces:
  - name: git-auth
    secret:
      secretName: "{{ git_auth_secret }}"
