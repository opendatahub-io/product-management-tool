apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://gitlab.com/test-org/test-repo-2/test-component-2/-/tree/{{revision}}
    build.appstudio.redhat.com/commit_sha: "{{revision}}"
    build.appstudio.redhat.com/target_branch: "{{target_branch}}"
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && target_branch == "test-branch-1.0" && (
          ".tekton/test-component-2-on-push.yaml".pathChanged() ||
          "test-context-2/test-args/build-2.conf".pathChanged() ||
          "test-context-2/TestContainerfile-2".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: test-full-container-test-branch-1-0
    appstudio.openshift.io/component: test-component-2-test-branch-1-0
    pipelines.appstudio.openshift.io/type: build
  name: test-component-2-test-branch-1-0-on-push
  namespace: test-tenant
spec:
  timeouts:
    pipeline: "2h0m0s"
    tasks: "1h30m0s"
    finally: "15m0s"
  params:
  - name: git-url
    value: "{{source_url}}"
  - name: revision
    value: "{{revision}}"
  - name: output-image
    value: quay.io/redhat-user-workloads/test-tenant/test-full-container-test-branch-1-0/test-component-2-test-branch-1-0:{{revision}}
  - name: dockerfile
    value: test-context-2/TestContainerfile-2
  - name: path-context
    value: test-context-2/test-build-context-2/
  - name: build-args-file
    value: test-context-2/test-args/build-2.conf
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
  - name: labels
    value:
    - name=test-org-prod/test-component-2-prod
    - com.redhat.component=test-org-prod/test-component-2-prod-container
    - cpe=cpe:/a:redhat:test_product:1.0::el9
  - name: additional-build-secret
    value: "test-registry-secret-2"
  - name: snyk-project-name
    value: "test-snyk-project-2"
  - name: snyk-org
    value: "test-snyk-org-uuid-2"
  pipelineRef:
    params:
    - name: org
      value: redhat
    - name: repo
      value: rhel-ai/konflux-data
    - name: scmType
      value: gitlab
    - name: serverURL
      value: https://gitlab.com
    - name: revision
      value: main
    - name: pathInRepo
      value: pipelines/full-container.yaml
    - name: token
      value: pipelines-as-code-secret
    - name: tokenKey
      value: password
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-test-component-2-test-branch-1-0
  workspaces:
  - name: git-auth
    secret:
      secretName: "{{ git_auth_secret }}"
