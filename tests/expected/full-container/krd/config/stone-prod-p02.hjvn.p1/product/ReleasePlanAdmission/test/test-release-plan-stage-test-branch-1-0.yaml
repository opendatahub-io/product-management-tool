---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: test-release-plan-stage-test-branch-1-0
  namespace: rhtap-releng-tenant
  labels:
    release.appstudio.openshift.io/block-releases: 'false'
    pp.engineering.redhat.com/business-unit: ai
spec:
  applications:
    - test-full-container-test-branch-1-0
  policy: stage-policy-name
  data:
    singleComponentMode: false
    mapping:
      components:
        - name: test-component-1-test-branch-1-0
          repository: quay.io/test-org/test-component-1-stage
        - name: test-component-2-test-branch-1-0
          repository: quay.io/test-org/test-component-2-stage
      defaults:
        pushSourceContainer: true
        tags:
          - "stage-latest"
          - "stage-{{ timestamp }}"
          - "stage-{{ revision }}"
    releaseNotes:
      product_name: Test Product Suite
      product_version: "1.0.0-test"
      product_id: [99999]
    intention: staging
  origin: test-tenant
  pipeline:
    pipelineRef:
      resolver: git
      params:
        - name: url
          value: "https://github.com/konflux-ci/release-service-catalog.git"
        - name: revision
          value: production
        - name: pathInRepo
          value: "test/pipelines/test-stage-pipeline.yaml"
    serviceAccountName: stage-service-account
    timeouts:
      pipeline: "4h0m0s"
      tasks: 4h0m0s
