---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  annotations:
    stream_name: test-stream
    cpe_name: test_product
    rhel_target: el9
  name: test-release-plan-prod-test-branch-1-0
  namespace: rhtap-releng-tenant
  labels:
    pp.engineering.redhat.com/business-unit: ai
    release.appstudio.openshift.io/block-releases: "false"
spec:
  applications:
    - test-full-container-test-branch-1-0
  policy: prod-policy-name
  data:
    singleComponentMode: true
    mapping:
      components:
        - name: test-component-1-test-branch-1-0
          repositories:
            - url: quay.io/test-org-prod/test-component-1-prod
        - name: test-component-2-test-branch-1-0
          repositories:
            - url: quay.io/test-org-prod/test-component-2-prod
        - name: test-component-3-test-branch-1-0
          repositories:
            - url: quay.io/test-org-prod/test-component-3-prod
      defaults:
        pushSourceContainer: true
        tags:
          - "latest"
          - "{{ timestamp }}"
          - "v1.0.0-{{ revision }}"
          - "stable"
    releaseNotes:
      product_name: Test Product Suite
      product_version: "1.0.0"
      product_id: [99999]
    intention: production
    enforceContainerFirstSecurityLabels: true
  origin: test-tenant
  pipeline:
    pipelineRef:
      resolver: git
      params:
        - name: url
          value: "https://github.com/konflux-ci/release-service-catalog.git"
        - name: revision
          value: production
        - name: pathInRepo
          value: "pipelines/managed/rh-advisories/rh-advisories.yaml"
    serviceAccountName: prod-service-account
    timeouts:
      pipeline: "8h0m0s"
      tasks: 8h0m0s
