---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: test-disk-release-plan-test-disk-branch
  namespace: rhtap-releng-tenant
  labels:
    release.appstudio.openshift.io/block-releases: 'false'
    pp.engineering.redhat.com/business-unit: ai
spec:
  applications:
    - test-disk-image-test-disk-branch
  policy: test-disk-policy
  data:
    singleComponentMode: true
    cdn:
      env: {{ error("RPA name must contain 'stage' or 'prod' for disk-image pipeline") }}
    mapping:
      components:
        - name: test-disk-component-test-disk-branch
          staged:
            destination: test-destination-path
            version: '1.0.0-test'
            files:
              - filename: test-disk-{{ release_timestamp }}-x86_64-boot.iso.gz
                source: test-install.iso.gz
          contentGateway:
            productName: Test Disk Image Product
            productCode: TESTDISK
            productVersionName: 1.0.0-test-staging
            filePrefix: test-disk-1.0.0
            contentType: disk-image
    releaseNotes:
      product_name: Test Disk Image Suite
      product_version: "1.0.0-disk-test"
      product_id: [77777]
    intention: disk-testing
  origin: test-disk-tenant
  pipeline:
    pipelineRef:
      resolver: git
      params:
        - name: url
          value: "https://github.com/konflux-ci/release-service-catalog.git"
        - name: revision
          value: production
        - name: pathInRepo
          value: "test/disk-pipelines/test-disk-pipeline.yaml"
    serviceAccountName: test-disk-service-account
    timeouts:
      pipeline: "4h0m0s"
      tasks: 4h0m0s
