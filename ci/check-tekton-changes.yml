spec:
  inputs:
    JOB_STAGE:
      default: lint

---

check-tekton-changes:
  stage: $[[ inputs.JOB_STAGE ]]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .tekton/*.yaml
  script:
    - |
      echo "WARNING: This MR modifies .tekton/ pipeline files."
      echo ""
      echo "These files are auto-generated by the Product Management Tool (PMT)."
      echo "Manual edits will be overwritten on the next PMT regeneration."
      echo ""
      echo "To make changes, update the PMC configs and re-run PMT:"
      echo "  Configs: https://github.com/red-hat-data-services/aipcc-product-management-configs"
      echo "  PMT:     https://github.com/opendatahub-io/product-management-tool"
      echo ""
      echo "If this change was generated by PMT, ignore this warning."
      exit 1
  allow_failure: true
